name: Verify public profile provider
on:
  push:
    branches: [profile-lookup]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/probe-profile.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-provider
          path: provider-probe/
          retention-days: 3
