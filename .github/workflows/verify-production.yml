name: Verify published application
on:
  push:
    branches: [main]
permissions:
  contents: read
  statuses: write
concurrency:
  group: singe-production-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/wait-production.mjs
      - run: npx playwright test --config playwright.production.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-report
          path: test-results/
          retention-days: 7
      - run: node scripts/report-ci.mjs
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SINGE_STATUS: ${{ job.status }}
